<body>



    <article class="card">
        <img src="assets/images/illustration-article.svg" alt="" class="card__img">
        <div class="card__content">
          <p class="card__tag">Learning</p>
          <p class="card__meta">Published <time datetime="2023-12-21">21 Dec 2023</time></p>
          <h2 class="card__tittle">HTML & CSS foundations</h2>
          <p class="card__Description">These languages are the backbone of every website, defining structure, content, and presentation.</p>
        </div>

        <footer class="card__author">
          <img src="assets/images/image-avatar.webp" alt="Greg Hooper avatar" class="card-author__avatar">
          <p class="card-author__name">Greg Hooper</p>
        </footer>
      </article>
